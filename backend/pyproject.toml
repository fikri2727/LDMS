[project]
name = "ldms-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
# Keep in sync with requirements.txt (Vercel installs from this list).
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.32",
    "sqlalchemy==2.0.*",
    "psycopg[binary]==3.2.*",
    "pydantic-settings==2.6.*",
    "bcrypt==4.2.*",
    "itsdangerous==2.2.*",
    "python-multipart==0.0.*",
    "python-dateutil==2.9.*",
    "openpyxl==3.1.*",
    "httpx>=0.27",
]

# Vercel: the FastAPI app object
[tool.vercel]
entrypoint = "app.main:app"
